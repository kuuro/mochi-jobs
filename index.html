<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mochi · Duyệt ảnh</title>
<style>
  :root { --bg:#fff7f9; --card:#fff; --ink:#3a2a30; --muted:#8a7279; --pink:#ff7aa2; --ok:#2fa36b; --line:#f0dfe4; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding-bottom:90px; }
  header { position:sticky; top:0; z-index:5; background:rgba(255,247,249,.95); backdrop-filter:blur(6px); padding:10px 12px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; flex:1 1 auto; }
  select, button { font:inherit; border-radius:10px; border:1px solid var(--line); background:#fff; padding:7px 10px; color:var(--ink); }
  button.primary { background:var(--pink); border-color:var(--pink); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; }
  .meta { padding:8px 12px; color:var(--muted); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:0 8px; }
  @media (min-width:700px){ .grid{ grid-template-columns:repeat(5,1fr);} }
  .tile { position:relative; background:var(--card); border-radius:10px; overflow:hidden; border:3px solid transparent; aspect-ratio:3/4; cursor:pointer; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; }
  .tile .n { position:absolute; left:6px; top:6px; background:rgba(0,0,0,.55); color:#fff; font-size:12px; padding:1px 7px; border-radius:20px; }
  .tile .tick { position:absolute; right:6px; top:6px; width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,.85); border:2px solid #fff; display:grid; place-items:center; font-size:16px; color:#fff; }
  .tile.sel { border-color:var(--ok); }
  .tile.sel .tick { background:var(--ok); }
  .tile .zoom { position:absolute; right:6px; bottom:6px; background:rgba(0,0,0,.55); color:#fff; border-radius:8px; padding:2px 7px; font-size:13px; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:#fff; border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; }
  .bar .count { flex:1; font-weight:600; }
  #msg { padding:8px 12px; font-size:13px; }
  #msg.err { color:#c0392b; } #msg.ok { color:var(--ok); }
  dialog { border:none; border-radius:14px; padding:16px; max-width:92vw; width:420px; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  dialog input, dialog textarea { width:100%; font:inherit; padding:8px; border:1px solid var(--line); border-radius:8px; margin:6px 0 10px; }
  #viewer { padding:0; background:#000; width:96vw; max-width:560px; }
  #viewer img { width:100%; display:block; border-radius:14px 14px 0 0; }
  #viewer .row { display:flex; gap:8px; padding:10px; background:#fff; border-radius:0 0 14px 14px; }
  #viewer .row button { flex:1; }
  .cap { padding:8px 12px; }
  .capopt { text-align:left; white-space:pre-line; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:#fff; font:inherit; font-size:14px; cursor:pointer; }
  .capopt.on { border-color:#d6336c; background:#fff0f6; }
  .cap textarea { width:100%; min-height:64px; font:inherit; padding:8px; border:1px solid var(--line); border-radius:10px; }
</style>
</head>
<body>
<header>
  <h1>🍡 Mochi · Duyệt ảnh</h1>
  <select id="daySel" aria-label="Chọn ngày"></select>
  <button id="cfgBtn" title="Cài đặt token">⚙️</button>
</header>
<div class="meta" id="meta">Đang tải…</div>
<div class="cap" id="capBox" hidden>
  <label for="cap" style="color:var(--muted);font-size:13px">Caption (sửa được, sẽ gửi cùng ảnh đã chọn)</label>
  <div id="capOpts" style="display:flex;flex-direction:column;gap:6px;margin:6px 0"></div>
  <textarea id="cap"></textarea>
</div>
<div class="grid" id="grid"></div>
<div id="msg"></div>

<div class="bar">
  <div class="count" id="count">Đã chọn 0</div>
  <button id="clearBtn">Bỏ chọn</button>
  <button id="sendBtn" class="primary" disabled>Gửi duyệt</button>
</div>

<dialog id="viewer">
  <img id="vImg" alt="">
  <div class="row"><button id="vTick">Chọn / bỏ chọn</button><button id="vClose">Đóng</button></div>
</dialog>

<dialog id="cfg">
  <h3 style="margin-top:0">Token GitHub</h3>
  <p style="font-size:13px;color:var(--muted)">Dán token (fine-grained, chỉ repo <b>kuuro/mochi-jobs</b>, quyền <b>Contents: Read and write</b>). Token chỉ lưu trong trình duyệt này.</p>
  <input id="tok" type="password" placeholder="github_pat_…" autocomplete="off">
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button id="cfgClear">Xoá token</button><button id="cfgSave" class="primary">Lưu</button>
  </div>
</dialog>

<script>
const OWNER = 'kuuro', REPO = 'mochi-jobs', BRANCH = 'main';
const $ = id => document.getElementById(id);
let days = [], cur = null, manifest = null, sel = new Set(), viewing = null;

const getTok = () => { try { return localStorage.getItem('mochi_tok') || ''; } catch { return ''; } };
const setTok = v => { try { v ? localStorage.setItem('mochi_tok', v) : localStorage.removeItem('mochi_tok'); } catch {} };
function say(t, kind) { const m = $('msg'); m.textContent = t || ''; m.className = kind || ''; }

async function getJSON(path) {
  const r = await fetch(path + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error(path + ' → ' + r.status);
  return r.json();
}

async function init() {
  try {
    days = (await getJSON('days/index.json')).days || [];
  } catch (e) { $('meta').textContent = 'Chưa có dữ liệu ngày nào.'; return; }
  days.sort().reverse();
  $('daySel').innerHTML = days.map(d => `<option>${d}</option>`).join('');
  if (days.length) loadDay(days[0]); else $('meta').textContent = 'Chưa có ngày nào.';
}

async function loadDay(d) {
  cur = d; sel = new Set(); say('');
  $('grid').innerHTML = ''; $('meta').textContent = 'Đang tải ' + d + '…';
  try { manifest = await getJSON(`days/${d}/manifest.json`); }
  catch (e) { $('meta').textContent = 'Lỗi tải manifest: ' + e.message; return; }
  try {
    const ap = await getJSON(`days/${d}/approved.json`);
    (ap.approved || []).forEach(id => sel.add(id));
    if (ap.caption) $('cap').value = ap.caption;
    say('Ngày này đã được gửi duyệt trước đó (' + sel.size + ' ảnh). Bạn có thể sửa và gửi lại.', 'ok');
  } catch { $('cap').value = manifest.caption || ''; }
  const opts = manifest.captions || [];
  $('capOpts').innerHTML = opts.map((c, i) => `<button type="button" class="capopt" data-i="${i}"><b>${i + 1}.</b> ${c.replace(/</g, '&lt;')}</button>`).join('');
  if (!$('cap').value && opts.length) $('cap').value = opts[0];
  $('capOpts').onclick = e => { const b = e.target.closest('.capopt'); if (!b) return; $('cap').value = opts[+b.dataset.i]; };
  $('capBox').hidden = false;
  $('meta').textContent = `${d} · ${manifest.items.length} ảnh` + (manifest.note ? ' · ' + manifest.note : '');
  render();
}

function render() {
  $('grid').innerHTML = manifest.items.map(it => `
    <div class="tile ${sel.has(it.id) ? 'sel' : ''}" data-id="${it.id}">
      <img loading="lazy" src="days/${cur}/${it.file}" alt="${it.id}">
      <span class="n">${it.id}</span><span class="tick">${sel.has(it.id) ? '✓' : ''}</span>
      <span class="zoom" data-zoom="${it.id}">🔍</span>
    </div>`).join('');
  $('count').textContent = 'Đã chọn ' + sel.size;
  $('sendBtn').disabled = sel.size === 0;
}

function toggle(id) { sel.has(id) ? sel.delete(id) : sel.add(id); render(); }

$('grid').addEventListener('click', e => {
  const z = e.target.closest('[data-zoom]');
  if (z) { openViewer(z.dataset.zoom); e.stopPropagation(); return; }
  const t = e.target.closest('.tile'); if (t) toggle(t.dataset.id);
});
function openViewer(id) {
  viewing = id; const it = manifest.items.find(x => x.id === id);
  $('vImg').src = `days/${cur}/${it.file}`; $('viewer').showModal();
}
$('vTick').onclick = () => { toggle(viewing); };
$('vClose').onclick = () => $('viewer').close();
$('clearBtn').onclick = () => { sel.clear(); render(); };
$('daySel').onchange = e => loadDay(e.target.value);
$('cfgBtn').onclick = () => { $('tok').value = getTok(); $('cfg').showModal(); };
$('cfgSave').onclick = () => {
  const v = $('tok').value.trim();
  if (v && !/^[\x21-\x7e]+$/.test(v)) { alert('Token có ký tự lạ (dấu tiếng Việt, "…" hoặc xuống dòng). Hãy copy lại đúng chuỗi github_pat_… từ GitHub, không gõ tay.'); return; }
  setTok(v); $('cfg').close(); say('Đã lưu token.', 'ok');
};
$('cfgClear').onclick = () => { setTok(''); $('tok').value = ''; };

const b64 = s => btoa(unescape(encodeURIComponent(s)));

$('sendBtn').onclick = async () => {
  const tok = getTok();
  if (!tok) { $('cfg').showModal(); return; }
  if (!/^[\x21-\x7e]+$/.test(tok)) { setTok(''); say('Token đang lưu có ký tự lạ. Bấm ⚙️ và dán lại token mới (copy từ GitHub).', 'err'); return; }
  const path = `days/${cur}/approved.json`;
  const api = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;
  const headers = { Authorization: 'Bearer ' + tok, Accept: 'application/vnd.github+json' };
  $('sendBtn').disabled = true; say('Đang gửi…');
  try {
    let sha;
    const g = await fetch(api + '?ref=' + BRANCH, { headers });
    if (g.ok) sha = (await g.json()).sha;
    const body = {
      message: `approve ${cur}: ${sel.size} ảnh`,
      branch: BRANCH,
      content: b64(JSON.stringify({
        date: cur,
        approved: manifest.items.filter(i => sel.has(i.id)).map(i => i.id),
        files: manifest.items.filter(i => sel.has(i.id)).map(i => i.file),
        caption: $('cap').value.trim(),
        approved_at: new Date().toISOString()
      }, null, 2) + '\n')
    };
    if (sha) body.sha = sha;
    const r = await fetch(api, { method: 'PUT', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error((await r.json()).message || r.status);
    say(`✓ Đã gửi ${sel.size} ảnh. Claude sẽ lên bài lúc 10h.`, 'ok');
  } catch (e) { say('Lỗi gửi: ' + e.message, 'err'); }
  $('sendBtn').disabled = sel.size === 0;
};

init();
</script>
</body>
</html>
